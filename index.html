<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="public, max-age=31536000">
    <meta name="description" content="തിരുന്നാൾ 2025 - വി. യൗസേപ്പിതാവിന്റെയും, വി. സെബസ്ത്യാനോസിന്റെയും, വി. ഗീവർഗ്ഗീസിന്റെയും സംയുക്ത തിരുനാൾ">
    <title>തിരുന്നാൾ 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- <link href="https://fonts.googleapis.com/css2?family=Chilanka&display=swap" rel="stylesheet"> -->
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@100;400;700&family=Noto+Sans+Malayalam:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="festive-bg">
    <!-- Festive Marquee Banner -->
    <div class="w-full bg-gradient-to-r from-pink-400 via-yellow-300 to-green-300 py-2 shadow-lg overflow-hidden relative z-50">
        <div class="marquee text-lg md:text-xl font-bold text-rose-800 flex items-center gap-4">
            <span>🎉</span>
            <span>തിരുനാൾ മംഗളങ്ങൾ! ഏവർക്കും സന്തോഷവും സമാധാനവും നിറഞ്ഞ തിരുനാൾ ആശംസകൾ!</span>
            <span>🎊</span>
            <span>2025 ഏപ്രിൽ 23 മുതൽ മെയ് 5 വരെ!</span>
            <span>🌟</span>
        </div>
    </div>
    <canvas class="confetti" id="confetti-canvas"></canvas>
    
    <div class="container mx-auto px-4">
        <header class="py-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <!-- Left side - St. Joseph -->
                <div class="w-full md:w-1/4 flex justify-center md:justify-start">
                    <img src="patrons/joseph.png" alt="St Joseph" class="patron-img">
                </div>
                
                <!-- Center - Title -->
                <div class="w-full md:w-2/4">
                    <h1 class="festive-title text-3xl md:text-5xl font-bold text-yellow-700 text-center">വി. യൗസേപ്പിതാവിന്റെയും,<br> വി. സെബസ്ത്യാനോസിന്റെയും,<br> വി. ഗീവർഗ്ഗീസിന്റെയും സംയുക്ത തിരുനാൾ</h1>
                </div>
                
                <!-- Right side - Other two saints -->
                <div class="w-full md:w-1/4 flex justify-center md:justify-end gap-4">
                    <img src="patrons/george.png" alt="St George" class="patron-img">
                    <img src="patrons/sebastian.png" alt="St Sebastian" class="patron-img">
                </div>
            </div>
        </header>
        <!-- Festive Umbrella Divider -->
        <div class="flex justify-center my-4">
            <svg height="40" viewBox="0 0 320 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full max-w-2xl">
                <g>
                    <g>
                        <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#ffb703"/>
                        <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ff0054"/>
                        <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                    </g>
                    <g transform="translate(60,0)">
                        <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#06d6a0"/>
                        <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ffd166"/>
                        <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                    </g>
                    <g transform="translate(120,0)">
                        <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#f72585"/>
                        <ellipse cx="30" cy="20" rx="10" ry="8" fill="#00b4d8"/>
                        <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                    </g>
                    <g transform="translate(180,0)">
                        <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#ffd166"/>
                        <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ff0054"/>
                        <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                    </g>
                    <g transform="translate(240,0)">
                        <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#00b4d8"/>
                        <ellipse cx="30" cy="20" rx="10" ry="8" fill="#06d6a0"/>
                        <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                    </g>
                </g>
            </svg>
        </div>
        <section class="max-w-2xl mx-auto my-8">
            <div class="editorial p-6">
                <h2 class="text-2xl font-bold text-pink-700 mb-2">വികാരിയച്ചന്റെ സന്ദേശം</h2>
                <p id="editorial-text" class="text-lg text-gray-800 leading-relaxed">വികാരിയച്ചൻ്റെ സന്ദേശം ഇവിടെ പ്രദർശിപ്പിക്കും...</p>
            </div>
        </section>

        <!-- <section>
            <img src="patrons/may 4.png" alt="" style="padding: 25px;">
        </section> -->

        <main class="max-w-7xl mx-auto py-8">
            <h2 class="text-2xl font-bold text-center text-rose-700 mb-6">തിരുനാൾ പ്രസുദേന്തിമാർ</h2>
            <div class="grid grid-cols-3 lg:grid-cols-4 gap-6" id="hosts-container">
                <!-- Host cards will be dynamically inserted here -->
            </div>
            <!-- Festive Umbrella Divider -->
            <div class="flex justify-center my-4">
                <svg height="40" viewBox="0 0 320 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full max-w-2xl">
                    <g>
                        <g>
                            <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#ffb703"/>
                            <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ff0054"/>
                            <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                        </g>
                        <g transform="translate(60,0)">
                            <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#06d6a0"/>
                            <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ffd166"/>
                            <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                        </g>
                        <g transform="translate(120,0)">
                            <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#f72585"/>
                            <ellipse cx="30" cy="20" rx="10" ry="8" fill="#00b4d8"/>
                            <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                        </g>
                        <g transform="translate(180,0)">
                            <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#ffd166"/>
                            <ellipse cx="30" cy="20" rx="10" ry="8" fill="#ff0054"/>
                            <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                        </g>
                        <g transform="translate(240,0)">
                            <path d="M20 40 Q20 20 40 20 Q60 20 60 40" fill="#00b4d8"/>
                            <ellipse cx="30" cy="20" rx="10" ry="8" fill="#06d6a0"/>
                            <rect x="28" y="28" width="4" height="12" fill="#8d5524"/>
                        </g>
                    </g>
                </svg>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
